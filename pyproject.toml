[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cai-nghien-trading-local-rag"
version = "0.1.0"
description = "Local knowledge extraction pipeline for a YouTube channel corpus."
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
youtube = [
  "yt-dlp>=2025.1.1",
  "youtube-transcript-api>=0.6.2",
]
ml = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "faster-whisper>=1.0",
  "opencv-python>=4.9",
  "paddleocr>=2.8",
]
asr = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12>=12.9,<13; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
ocr = [
  # 3.3.1 trips a Windows CPU oneDNN/PIR runtime error on PaddleOCR detection.
  "paddlepaddle==3.2.2",
  "paddleocr>=3.5.0",
]
chat = [
  "huggingface-hub>=0.26",
  "llama-cpp-python>=0.3.9",
  "nvidia-cuda-runtime>=13",
  "nvidia-cublas-cu12>=12.9",
]
dev = [
  "pytest>=8.0",
]

# GPU Windows: sau `uv sync --extra chat` chạy `.\scripts\install_chat_gpu.ps1` (build CUDA từ source).

[project.scripts]
cnga = "cai_nghien_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
