[channel]
url = "https://www.youtube.com/@cainghientrading"
default_tab = "videos"

[storage]
raw_dir = "data/raw"
analysis_dir = "data/analysis"
logs_dir = "logs"
cache_dir = ".cache"
models_dir = "models"

[pipeline]
version = "0.1.0"
default_batch_size = 8
oldest_first = true

[retrieval]
backend = "sqlite_fts"
index_path = "data/analysis/index/search.sqlite"
chroma_path = "data/analysis/index/chroma"
default_limit = 5
min_content_evidence = 1

[models]
chat_model_dir = "models/chat"
vision_model_dir = "models/vision"
embedding_model_dir = "models/embeddings"
asr_model_dir = "models/asr"
ocr_model_dir = "models/ocr"
ollama_models_dir = "models/ollama"

[media]
audio_format = "bestaudio[ext=m4a]/bestaudio"
video_light_format = "bv*[height<=720][ext=mp4]/bv*[height<=720]/bv*[height<=480]/bestvideo"
frame_scene_threshold = 0.25
frame_max_per_video = 80

[transcript_quality]
cleaner_logic_version = "2.0.0"
default_model_id = "conservative-refine"
default_engine = "conservative-refine"
asr_confusion_map = "data/analysis/transcript_quality/asr_confusion_map.json"
review_ui_host = "127.0.0.1"
review_ui_port = 8765
pause_file = "data/analysis/state/transcript_clean.pause"

[transcript_quality.asr_reprocess]
model_size = "large-v3"
device = "cuda"
compute_type = "float16"
beam_size = 8

[pipeline.full_run]
# Mặc định cho scripts/run_layer_a.py và run_full_pipeline.py
content_type = "regular+livestream"
model_size = "large-v3"
device = "cuda"
compute_type = "float16"
beam_size = 8
index_every = 10

[pipeline.layer_b]
# Mặc định cho scripts/run_layer_b.py (None = mọi video có transcript)
content_type = ""
skip_asr_reprocess = true
asr_reprocess_limit = 20

[pipeline.layer_c]
# build-index: optional search index (không cần cho trích xuất kiến thức)

[pipeline.layer_d]
# Mặc định cho scripts/run_layer_d.py — trích xuất fact từ transcript + OCR
content_type = ""

[pipeline.reprocess]
year = 2026
content_type = "regular+livestream"
reset_review = true
skip_index = true
enable_asr_reprocess = true
model_size = "large-v3"
device = "cuda"
compute_type = "float16"
beam_size = 8
review_mode = "agent_session"

[knowledge_extraction]
output_dir = "data/analysis/knowledge"
min_sentence_chars = 20
require_domain_term = true
include_ocr = true

[playbook]
output_dir = "data/analysis/knowledge"

[chat]
llama_endpoint = "http://127.0.0.1:8080/completion"
max_tokens = 900
temperature = 0.15
style_evidence_limit = 3

[guardrails]
unknown_answer = "Tôi không biết dựa trên dữ liệu đã phân tích từ kênh này."
allow_cloud = false
allow_style_as_fact = false
